<!doctype html>
<!--
  原型（throwaway prototype，非生产代码）
  问题：在现有 AI Presentation Studio 界面上新增「导入演示」功能，应该长什么样？
  形态：单文件高保真桌面原型，12 个屏幕，底部浮动切换条（← → 键或点击切换），?screen=N 可直达。
  设计依据：reference/ 下 4 张现有界面截图（唯一依据，既有页面原样复现）；
  新增界面全部用截图中已有的组件样式拼装（白卡、药丸按钮、绿色芯片、对话框、等宽计数）。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · AI Presentation Studio 导入演示</title>
<style>
  :root {
    --canvas: #f6f7fb;
    --card: #ffffff;
    --ink: #17181c;
    --smoke: #6f7480;
    --ash: #9aa3ad;
    --hairline: #ebe8e4;
    --hairline-cool: #e7e9f0;
    --green: #65d66f;
    --green-deep: #277833;
    --green-mid: #3f9e63;
    --green-tint: #e9f7ee;
    --danger: #c84949;
    --danger-tint: #fdeeee;
    --amber: #8a6116;
    --amber-tint: #fdf4dc;
    --radius-card: 20px;
    --shadow-card: 0 1px 2px rgba(23,24,28,.04), 0 10px 28px rgba(23,24,28,.05);
    --shadow-pop: 0 2px 4px rgba(23,24,28,.05), 0 18px 44px rgba(23,24,28,.12);
    --mono: "Geist Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 400 14px/1.5 Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1, h2, h3, p { margin: 0; }
  button { cursor: pointer; font: inherit; }

  /* ============ 应用外壳（与现有截图一致） ============ */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; flex-shrink: 0; background: #fff;
    border-right: 1px solid var(--hairline-cool);
    display: flex; flex-direction: column; gap: 30px;
    padding: 22px 18px 20px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-icon { width: 34px; height: 34px; flex-shrink: 0; }
  .brand b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .brand small { display: block; color: var(--smoke); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 12px 14px; border: 0; border-radius: 12px;
    background: transparent; color: #3c414b; font-size: 14.5px; font-weight: 600; text-align: left;
  }
  .nav-item svg { flex-shrink: 0; }
  .nav-item.active { background: #f1f3f6; color: var(--ink); }
  .side-label { color: var(--ash); font-size: 12px; font-weight: 600; margin: 0 0 10px; }
  .workspace { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: #eef1f5; color: #3c414b; display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .workspace b { display: block; font-size: 13px; font-weight: 700; }
  .workspace small { display: block; color: var(--smoke); font-size: 11.5px; margin-top: 2px; }
  .side-footer { margin-top: auto; display: flex; align-items: center; gap: 11px; }
  .local-icon {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: #2fb344; display: grid; place-items: center;
  }
  .local-icon i { width: 10px; height: 10px; border-radius: 3px; background: #fff; }
  .side-footer b { display: block; font-size: 13px; font-weight: 700; }
  .side-footer small { display: block; color: var(--smoke); font-size: 11.5px; margin-top: 2px; }

  .main { flex: 1; min-width: 0; }

  /* ============ 通用组件（截图中已有） ============ */
  .eyebrow { color: var(--ash); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .card {
    background: var(--card); border: 1px solid var(--hairline-cool);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px; border: 1px solid #e3e5ea;
    background: #fff; color: var(--ink); font-size: 13px; font-weight: 600;
  }
  .pill.disabled { background: #f3f4f6; border-color: #f3f4f6; color: #b9bfc7; }
  .pill-dark {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 999px; border: 1px solid #101010;
    background: #101010; color: var(--green); font-size: 13px; font-weight: 700;
  }
  .pill-danger {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px; border: 1px solid #eec3c3;
    background: #fff; color: var(--danger); font-size: 13px; font-weight: 600;
  }
  .orb {
    width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%;
    background: #101010; display: grid; place-items: center;
  }
  .back-circle {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid #e3e5ea; background: #fff; display: grid; place-items: center;
  }
  .pagebar { display: flex; align-items: center; gap: 16px; padding: 26px 36px 22px; }
  .pagebar .title { font-size: 23px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #2fb344; }
  .chip-step {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;
    background: var(--green-tint); color: #2e9e57;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }

  /* 首页 */
  .home { position: relative; padding-bottom: 60px; }
  .home-glow {
    position: absolute; inset: 0 0 auto 0; height: 560px; pointer-events: none;
    background:
      radial-gradient(900px 340px at 8% -12%, rgba(118, 150, 246, .32), transparent 68%),
      radial-gradient(900px 360px at 88% -14%, rgba(247, 158, 200, .30), transparent 68%);
  }
  .home-dots {
    position: absolute; inset: 560px 0 0 0; pointer-events: none;
    background-image: radial-gradient(rgba(23,24,28,.07) 1px, transparent 1.4px);
    background-size: 26px 26px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 55%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 55%);
  }
  .home-inner { position: relative; }
  .hero { text-align: center; padding: 74px 40px 0; }
  .hero-brand { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 46px; font-weight: 800; letter-spacing: -.02em; }
  .hero-tagline { margin-top: 22px; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .hero-copy { margin-top: 12px; color: var(--smoke); font-size: 15px; }
  .entries { display: flex; gap: 22px; justify-content: center; align-items: stretch; max-width: 1040px; margin: 44px auto 0; padding: 0 40px; }
  .entry-card {
    display: flex; align-items: center; gap: 16px; padding: 20px 22px;
    border-radius: var(--radius-card); text-align: left;
    background: #fff; border: 1px solid var(--hairline-cool); box-shadow: var(--shadow-card);
  }
  .entry-card.main { flex: 1.55; }
  .entry-card.sub { flex: 1; }
  .plus-circle {
    width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%;
    background: #f1f3f6; color: #3c414b; display: grid; place-items: center;
  }
  .entry-copy { flex: 1; min-width: 0; }
  .entry-copy b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .entry-copy small { display: block; margin-top: 4px; color: var(--smoke); font-size: 12.5px; }
  .recent { max-width: 1080px; margin: 64px auto 0; padding: 0 40px; }
  .recent-head { display: flex; align-items: flex-end; justify-content: space-between; }
  .recent-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 8px; }
  .count-pill { padding: 7px 14px; border-radius: 999px; border: 1px solid #e3e5ea; background: #fff; color: var(--smoke); font-size: 12.5px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px; margin-top: 26px; }
  .pcard { border-radius: 18px; padding: 12px 12px 14px; background: #fff; border: 1px solid var(--hairline-cool); box-shadow: var(--shadow-card); }
  .cover {
    position: relative; overflow: hidden; aspect-ratio: 16/9;
    border-radius: 12px; padding: 18px 20px;
  }
  .cover .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .22em; }
  .cover .ring { position: absolute; border: 1.5px solid currentColor; border-radius: 50%; opacity: .5; }
  .cover .tpl-pill {
    position: absolute; top: 14px; right: 14px; padding: 4px 11px;
    border: 1.5px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 600; opacity: .85;
  }
  .cover .c-title { position: absolute; left: 20px; bottom: 40px; font: 700 26px/1.2 Georgia, "Noto Serif SC", serif; letter-spacing: .01em; }
  .cover .c-num { position: absolute; right: 20px; bottom: 14px; font-size: 13px; font-weight: 600; opacity: .8; }
  .cover.grove-warm { background: #edb87f; color: #593311; }
  .cover.grove-sage { background: #dfe7d8; color: #33502d; }
  .pcard .kind { margin: 12px 4px 0; color: var(--ash); font-size: 11px; }
  .pcard h3 { margin: 3px 4px 0; font-size: 16.5px; font-weight: 700; }
  .pcard .meta { display: flex; align-items: center; justify-content: space-between; margin: 10px 4px 2px; color: var(--smoke); font-size: 12.5px; }
  .pcard .meta .st { color: #7d8a80; font-weight: 600; }

  /* 新建演示页 */
  .new-wrap { max-width: 1180px; margin: 0 auto; padding: 0 36px 60px; }
  .panels { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(360px, 1fr); gap: 24px; align-items: start; }
  .panel { padding: 30px 32px 32px; }
  .panel-head { display: flex; gap: 15px; align-items: flex-start; }
  .panel-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .panel-head p { margin-top: 6px; color: var(--smoke); font-size: 13px; }
  .source-box {
    width: 100%; min-height: 540px; margin-top: 24px; padding: 22px 24px;
    border: 1.5px solid #bfe8cc; border-radius: 14px; background: #fff;
    color: #b6bcc4; font-size: 15px; line-height: 1.9; resize: none; outline: none; font: inherit;
  }
  .tpl-list { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
  .tpl-option {
    display: flex; align-items: center; gap: 14px; padding: 13px 14px;
    border: 1.5px solid #e7e9f0; border-radius: 14px; background: #fff;
  }
  .tpl-option.selected { border-color: var(--green-mid); }
  .tpl-swatch {
    width: 62px; height: 62px; flex-shrink: 0; border-radius: 9px; position: relative; overflow: hidden;
    background: #16240f; display: grid; place-items: center;
  }
  .tpl-swatch span { color: #d8d3c4; font: 700 21px Georgia, "Noto Serif SC", serif; }
  .tpl-swatch i { position: absolute; right: -6px; top: 12px; width: 26px; height: 3.5px; background: #c8524a; transform: rotate(-32deg); }
  .radio-dot { width: 15px; height: 15px; flex-shrink: 0; border-radius: 50%; border: 5px solid #3573f0; background: #fff; }
  .radio-dot.off { border: 1.5px solid #c9cdd6; }
  .tpl-copy b { display: block; font-size: 15px; font-weight: 700; }
  .tpl-copy small { display: block; margin-top: 4px; color: var(--smoke); font-size: 12.5px; line-height: 1.55; }
  .send-btn {
    width: 100%; margin-top: 22px; padding: 15px 20px; border: 0; border-radius: 13px;
    background: #c9ccd2; color: #fff; font-size: 14.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
  }
  .send-note { margin-top: 13px; color: var(--smoke); font-size: 12.5px; line-height: 1.6; }

  /* 预览 / 编辑 */
  .stage-shell { margin: 0 36px 36px; padding: 16px; border-radius: var(--radius-card); background: #eceef2; }
  .deck-shell { position: relative; border-radius: 10px; overflow: hidden; background: #1d2b1c; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .deck { position: relative; aspect-ratio: 16/8.2; padding: 8.5% 9%; color: #d8d3c4; }
  .deck .crumb { display: inline-flex; gap: 14px; color: #d98e57; font-size: 12.5px; letter-spacing: .28em; font-weight: 600; }
  .deck .crumb .u { border-bottom: 1.5px solid #c8524a; padding-bottom: 8px; }
  .deck h1.slide-title { margin-top: 7.5%; font: 400 clamp(30px, 4.6vw, 62px)/1.15 Georgia, "Noto Serif SC", serif; color: #d8d3c4; letter-spacing: .01em; }
  .deck h1.slide-title em { font-style: italic; color: #4d6bf0; }
  .deck .sub { margin-top: 4.5%; color: #e5c86e; font-size: clamp(12px, 1.35vw, 18px); letter-spacing: .06em; }
  .deck .foot {
    position: absolute; left: 9%; right: 9%; bottom: 7%;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(216,211,196,.28); padding-top: 14px;
    color: #b9b4a4; font-size: 10.5px; letter-spacing: .24em; font-weight: 600;
  }
  .deck .ghost { position: absolute; right: 5%; bottom: -4%; font: 400 200px/1 Georgia, serif; color: rgba(216,211,196,.1); }
  .deck .counter {
    position: absolute; top: 18px; right: 18px; padding: 7px 14px;
    background: rgba(12,16,12,.82); border-radius: 999px; color: #fff;
    font: 600 13px var(--mono); letter-spacing: .06em;
  }
  .deck .pager { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
  .deck .pager i { width: 6px; height: 6px; border-radius: 50%; background: rgba(216,211,196,.35); }
  .deck .pager i.on { background: #f2efe6; }

  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .editable-flag { display: flex; align-items: center; gap: 8px; color: #4c525c; font-size: 13px; font-weight: 600; margin-right: 4px; }

  .edit-stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
  .props { padding: 22px 20px; border-radius: 16px; background: #fff; border: 1px solid var(--hairline-cool); align-self: start; }
  .props .lab { color: var(--smoke); font-size: 12.5px; }
  .props .sel { margin-top: 6px; font-size: 15px; font-weight: 700; }
  .props hr { border: 0; border-top: 1px solid var(--hairline-cool); margin: 18px 0; }
  .field { margin-top: 14px; }
  .field label { display: block; margin-bottom: 7px; color: #4c525c; font-size: 13px; font-weight: 600; }
  .field textarea { width: 100%; min-height: 86px; padding: 11px 12px; border: 1px solid #e3e5ea; border-radius: 9px; font: inherit; resize: vertical; outline: none; }
  .field input, .field select {
    width: 100%; height: 40px; padding: 0 12px; border: 1px solid #e3e5ea;
    border-radius: 9px; font: inherit; background: #fff; outline: none;
  }
  .field input[type="color"] { padding: 4px; height: 40px; }
  .field .mono { font-family: var(--mono); }
  .align-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .align-row span {
    height: 38px; display: grid; place-items: center; border-radius: 9px;
    background: #f1f3f6; color: #3c414b; font-size: 13.5px; font-weight: 600;
  }
  .align-row span.off { color: #b9bfc7; }
  .props-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .props-actions .pill, .props-actions .pill-danger { justify-content: center; }
  .lock-hint {
    display: flex; gap: 10px; margin-top: 18px; padding: 12px 13px;
    border-radius: 11px; background: #f6f7f9; color: var(--smoke); font-size: 12.5px; line-height: 1.55;
  }
  .lock-hint b { color: #4c525c; }

  /* 上传对话框 */
  .overlay { position: fixed; inset: 0; background: rgba(23,24,28,.44); display: grid; place-items: center; z-index: 30; }
  .dialog { width: min(560px, calc(100vw - 48px)); border-radius: 22px; background: #fff; box-shadow: var(--shadow-pop); padding: 30px 30px 26px; }
  .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .dialog-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .x-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #f1f3f6; color: #6f7480; font-size: 15px; }
  .dropzone {
    margin-top: 22px; padding: 44px 24px; text-align: center;
    border: 2px dashed #c9cdd6; border-radius: 16px; background: #fafbfd;
  }
  .dropzone .dz-icon { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; background: #eceef2; display: grid; place-items: center; }
  .dropzone b { display: block; margin-top: 14px; font-size: 15.5px; font-weight: 700; }
  .dropzone .hint { margin-top: 6px; color: var(--smoke); font-size: 12.5px; }
  .file-chip {
    margin-top: 16px; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--hairline-cool); border-radius: 13px; background: #fff;
  }
  .file-chip .f-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: var(--green-tint); display: grid; place-items: center; }
  .file-chip b { display: block; font-size: 14px; font-weight: 700; }
  .file-chip small { display: block; margin-top: 2px; color: var(--smoke); font-size: 12px; font-family: var(--mono); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 26px; }

  /* 导入检查报告 */
  .report-wrap { max-width: 880px; margin: 0 auto; padding: 0 36px 70px; }
  .result-badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 20px; border-radius: 999px; font-size: 15.5px; font-weight: 800;
  }
  .result-badge .b-icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .result-badge.pass { background: var(--green-tint); color: var(--green-deep); border: 1px solid #bfe6cd; }
  .result-badge.pass .b-icon { background: #2fb344; }
  .result-badge.partial { background: var(--amber-tint); color: var(--amber); border: 1px solid #f0dfa8; }
  .result-badge.partial .b-icon { background: #e3a93c; }
  .result-badge.blocked { background: var(--danger-tint); color: var(--danger); border: 1px solid #f3c4c4; }
  .result-badge.blocked .b-icon { background: var(--danger); }
  .badge-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 6px 0 18px; }
  .badge-row .note { color: var(--smoke); font-size: 12.5px; }
  .file-card { display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
  .file-card .f-icon { width: 48px; height: 48px; flex-shrink: 0; border-radius: 13px; background: #f1f3f6; display: grid; place-items: center; }
  .file-card b { display: block; font-size: 16px; font-weight: 700; }
  .file-card small { display: block; margin-top: 3px; color: var(--smoke); font-size: 12px; font-family: var(--mono); letter-spacing: .02em; }
  .rules { margin-top: 22px; padding: 10px 22px 14px; }
  .rule { display: flex; align-items: center; gap: 13px; padding: 15px 0; border-bottom: 1px solid #f1f2f5; }
  .rule:last-child { border-bottom: 0; }
  .rule .r-icon { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; }
  .rule.pass .r-icon { background: #e5f6eb; color: #277833; }
  .rule.lock .r-icon { background: #eef0f4; color: #6f7480; }
  .rule.bad .r-icon { background: var(--danger-tint); color: var(--danger); }
  .rule .r-text b { display: block; font-size: 14.5px; font-weight: 600; }
  .rule .r-text small { display: block; margin-top: 2px; color: var(--smoke); font-size: 12.5px; }
  .rule .r-state { margin-left: auto; flex-shrink: 0; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .rule.pass .r-state { background: var(--green-tint); color: var(--green-deep); }
  .rule.lock .r-state { background: #eef0f4; color: #6f7480; }
  .rule.bad .r-state { background: var(--danger-tint); color: var(--danger); }
  .group-head { display: flex; align-items: center; gap: 9px; padding: 18px 0 4px; color: #4c525c; font-size: 13px; font-weight: 800; }
  .group-head:first-child { padding-top: 12px; }
  .group-head .g-count { color: var(--ash); font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .report-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 26px; }
  .report-actions .spacer { margin-right: auto; display: flex; align-items: center; gap: 8px; color: var(--smoke); font-size: 13px; }

  /* 交互示意 */
  .demo-wrap { max-width: 940px; margin: 0 auto; padding: 10px 36px 80px; }
  .demo-card { padding: 34px 34px 26px; }
  .demo-slide {

/* ---------- 切换器 ---------- */
const root = document.getElementById("screens");
const label = document.getElementById("sw-label");
let index = 0;
const params = new URLSearchParams(location.search);
const fromUrl = parseInt(params.get("screen", "", 10));
if (Number.isInteger(fromUrl) && fromUrl >= 1 && fromUrl <= screens.length) index = fromUrl - 1;

function render() {
  root.innerHTML = screens[index].build();
  label.innerHTML = (index + 1) + " / " + screens.length + " · " + screens[index].label + '<small>← → 切换</small>';
  const url = new URL(location.href);
  url.searchParams.set("screen", String(index + 1));
  history.replaceState(null, "", url);
}
document.getElementById("prev").addEventListener("click", () => { index = (index - 1 + screens.length) % screens.length; render(); });
document.getElementById("next").addEventListener("click", () => { index = (index + 1) % screens.length; render(); });
document.addEventListener("keydown", (event) => {
  const target = event.target;
  if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
  if (event.key === "ArrowLeft") { index = (index - 1 + screens.length) % screens.length; render(); }
  if (event.key === "ArrowRight") { index = (index + 1) % screens.length; render(); }
});
render();
</script>
